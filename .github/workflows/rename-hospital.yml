name: Rename Hospital
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Asha Hospital to Sewa Hospital
        run: |
          sed -i 's/Asha Hospital/SEWA HOSPITAL/g; s/Asha Hospital/SEWA HOSPITAL/g; s/Asha Hospital/SEWA HOSPITAL/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename hospital to SEWA HOSPITAL' || exit 0
          git push
