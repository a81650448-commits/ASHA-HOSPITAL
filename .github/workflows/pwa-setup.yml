name: Finish SEWA Hospital PWA setup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  setup-pwa:
    if: ${{ !contains(github.event.head_commit.message, '[pwa-setup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate PWA icons
        run: |
          mkdir -p icons
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -background none icons/icon.svg icons/icon-512.png
          convert -background none -resize 192x192 icons/icon.svg icons/icon-192.png
          convert -background '#0b6b78' -resize 512x512 icons/icon.svg icons/icon-512-maskable.png
      - name: Add manifest and service worker registration to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'manifest.webmanifest' not in s:
              s=s.replace('</head>', '<link rel="manifest" href="/ASHA-HOSPITAL/manifest.webmanifest"><meta name="theme-color" content="#0b6b78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SEWA Hospital"></head>', 1)
          if 'navigator.serviceWorker.register' not in s:
              code='''<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/ASHA-HOSPITAL/sw.js").catch(()=>{}));}let sewaInstallPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();sewaInstallPrompt=e;let b=document.getElementById("installAppBtn");if(b)b.style.display="inline-block";});function installSEWA(){if(!sewaInstallPrompt)return;sewaInstallPrompt.prompt();sewaInstallPrompt.userChoice.finally(()=>{sewaInstallPrompt=null;let b=document.getElementById("installAppBtn");if(b)b.style.display="none";});}</script>'''
              s=s.replace('</body>', code+'</body>', 1)
          if 'id="installAppBtn"' not in s:
              button='<button id="installAppBtn" onclick="installSEWA()" style="display:none;position:fixed;right:18px;bottom:88px;z-index:9999;background:#0b6b78;color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:0 5px 18px #0003">📲 Install SEWA Hospital</button>'
              s=s.replace('</body>', button+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit generated PWA files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html icons/manifest.webmanifest sw.js 2>/dev/null || true
          git add index.html icons manifest.webmanifest sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable SEWA Hospital PWA [pwa-setup]'
          git push
